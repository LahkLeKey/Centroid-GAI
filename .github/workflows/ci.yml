name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  knowledge-ingestion:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline bulk-preparation test dependencies
        run: python -m pip install -r tools/knowledge/bulk-requirements.txt
      - name: Build native trainer for ingestion smoke test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release
      - name: Test Git encyclopedia import without network or credentials
        env:
          CGAI_EXECUTABLE: ${{ runner.os == 'Windows' && 'build/Release/cgai.exe' || 'build/cgai' }}
        run: python -m unittest discover -s tools/knowledge/tests -v

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  native-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Clang tools
        run: |
          sudo apt-get update && sudo apt-get install --yes clang-tidy
          python -m pip install clang-format==21.1.0
      - name: Build Node addon and download matching headers
        working-directory: persistence
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build native addon
        working-directory: persistence/api
        run: bun run native:build
      - name: Test Node addon
        working-directory: persistence/api
        run: bun run native:test
      - name: Evaluate model baselines without network or database
        working-directory: persistence/api
        run: |
          bun run baseline:test
          bun run baseline
          bun run chat:evaluate
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify repository training and record held-out quality
        run: |
          node --test persistence/api/src/evaluation/codebase-data.test.ts
          python -m tools.knowledge snapshot --config examples/knowledge/codebase.json --repo . --ref HEAD --output build/knowledge/codebase
          node persistence/api/src/evaluation/codebase.ts --snapshot build/knowledge/codebase --output build/evaluation/codebase
      - name: Evaluate source retrieval and repository-question citations
        run: |
          node --test persistence/api/src/knowledge/retrieval.test.ts
          node persistence/api/src/evaluation/repository.ts --snapshot build/knowledge/codebase --output build/evaluation/repository.json
      - name: Verify static categorized codebase centroids and spatial neighbors
        run: |
          node --test persistence/api/src/knowledge/compile-native-knowledge.test.ts
          node --test persistence/api/src/knowledge/codebase-centroids.test.ts
          node persistence/api/src/knowledge/codebase-centroids.ts --directory knowledge/codebase/codebase-v1 --verify
      - uses: actions/upload-artifact@v4
        with:
          name: model-baselines
          path: |
            build/evaluation/baseline.json
            build/evaluation/chat
            build/evaluation/codebase
            build/evaluation/repository.json
            build/knowledge/codebase
          if-no-files-found: error
      - name: Configure native checks
        run: cmake -S . -B build-lint
      - name: Lint all C sources and check formatting
        run: cmake --build build-lint --target cgai_lint cgai_format_check

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen
      - name: Configure documentation
        run: cmake -S . -B build-docs -DCGAI_BUILD_DOCS=ON -DCGAI_BUILD_TESTS=OFF
      - name: Enforce documentation standard
        run: cmake --build build-docs --target docs
      - uses: actions/upload-artifact@v4
        with:
          name: api-documentation
          path: build-docs/docs/html
          if-no-files-found: error

  api-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGAI_API_URL: http://127.0.0.1:3000
      CGAI_CHAT_API_TOKEN: isolated-ci-test-token
      CGAI_SEARCH_PROVIDER: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install workspace dependencies
        working-directory: persistence
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Typecheck persistence packages
        working-directory: persistence
        run: bun run typecheck
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test repository scenario assertions
        working-directory: persistence/api
        run: bun run repository:test
      - name: Test API and all repository conversations against isolated Compose
        working-directory: persistence
        shell: bash
        run: |
          set -o pipefail
          bun run test:repository 2>&1 | tee ../compose-ci.log
      - name: Save repository transcripts and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-chat-integration
          path: |
            compose-ci.log
            build/evaluation/repository-chat
            build/knowledge/repository-e2e-*/fixture.json
            build/knowledge/repository-e2e-*/provenance.json
          retention-days: 7
