name: C11 Life
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure C11 runtime
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Install native package
        run: cmake --install build --config Release --prefix build/install
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native tooling
        run: sudo apt-get update && sudo apt-get install --yes clang-tidy clang-format
      - name: Configure
        run: cmake -S . -B build-lint
      - name: Check C11
        run: cmake --build build-lint --target life_lint life_format_check
      - name: Build source evolution CLI
        run: cmake --build build-lint --target cgai_life_evolve --parallel
      - name: Test source evolution
        run: ./build-lint/cgai_life_evolve --out build-lint/evolution-check --candidates 2 --steps 64
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure instrumented C11
        run: cmake -S . -B build-sanitizers -DCMAKE_BUILD_TYPE=Debug -DCGAI_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitizers --parallel
      - name: Test
        run: ctest --test-dir build-sanitizers --output-on-failure
