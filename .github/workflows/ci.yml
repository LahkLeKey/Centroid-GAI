name: CI

on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  native-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install Clang tools
        run: |
          sudo apt-get update && sudo apt-get install --yes clang-tidy
          python -m pip install clang-format==21.1.0
      - name: Build Node addon and download matching headers
        working-directory: persistence
        run: bun install --frozen-lockfile
      - name: Build native addon
        working-directory: persistence/api
        run: bun run native:build
      - name: Test Node addon
        working-directory: persistence/api
        run: bun run native:test
      - name: Configure native checks
        run: cmake -S . -B build-lint
      - name: Lint all C sources and check formatting
        run: cmake --build build-lint --target cgai_lint cgai_format_check

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install --yes doxygen
      - name: Configure documentation
        run: cmake -S . -B build-docs -DCGAI_BUILD_DOCS=ON -DCGAI_BUILD_TESTS=OFF
      - name: Enforce documentation standard
        run: cmake --build build-docs --target docs
