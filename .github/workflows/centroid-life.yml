name: Standalone C11 Life
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone entry
        run: cmake -S tools/life -B build/life -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build/life --parallel
      - name: Test
        run: ctest --test-dir build/life --output-on-failure
