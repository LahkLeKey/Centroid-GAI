# Repository conversations read verified snapshots; the API cannot edit this mount.
services:
  api:
    environment:
      CGAI_REPOSITORY_SNAPSHOT: /app/knowledge/snapshots/${CGAI_REPOSITORY_REF:?Set CGAI_REPOSITORY_REF to a prepared snapshot directory name}
      CGAI_REPOSITORY_ADDITIONAL_SNAPSHOTS: ${CGAI_REPOSITORY_ADDITIONAL_SNAPSHOTS:-[]}
    volumes:
      - type: bind
        source: ${CGAI_REPOSITORY_ROOT_HOST:-./build/knowledge/repository}
        target: /app/knowledge/snapshots
        read_only: true
        bind:
          create_host_path: false
